name: Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - site/**

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/_validate.yaml
    secrets: inherit

  bump:
    name: bump
    needs: validate
    uses: ./.github/workflows/_bump_version.yaml
    secrets: inherit

  release:
    name: release
    needs: bump
    uses: ./.github/workflows/_create_release.yaml
    secrets: inherit

  deploy-docs:
    name: deploy-docs
    needs: release
    uses: ./.github/workflows/_deploy_docs.yaml
    with:
      ref: main

  test-install-live:
    name: test-install
    needs: deploy-docs
    uses: ./.github/workflows/_test_install.yaml
    with:
      mode: live
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  cleanup-failed-release:
    name: cleanup-failed-release
    needs: [release, test-install-live]
    if: ${{ always() && needs.test-install-live.result == 'failure' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete failed release
        run: |
          echo "Install test failed — deleting release ${{ needs.release.outputs.tag }}"
          gh release delete "${{ needs.release.outputs.tag }}" --yes \
            --cleanup-tag --repo "${{ github.repository }}"
