name: Security Checks
on:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/envrc
      - uses: ./.github/actions/setup
        with:
          rust: false
      - name: Additional Tools
        run: ./scripts/chores/install_tools.sh govulncheck

      - name: Go Security
        run: cd go && govulncheck ./...

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/envrc
      - uses: ./.github/actions/setup
        with:
          go: false
      - name: Additional Tools
        run: ./scripts/chores/install_tools.sh cargo-audit

      - name: Debug PATH
        run: |
          echo "PATH: $PATH"
          echo "CARGO_HOME: ${CARGO_HOME:-not set}"
          which cargo-audit || echo "cargo-audit not in PATH"
          ls -la ~/.cargo/bin/ || echo "~/.cargo/bin doesn't exist"
          cargo --list | grep audit || echo "cargo doesn't see audit"

      - name: Rust Security
        run: cargo audit -f crates/Cargo.lock