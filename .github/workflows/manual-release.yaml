name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - release
          - patch
          - minor
          - major
          - dev
          - alpha
          - beta
          - rc
      skip_validation:
        description: 'Skip lint and tests'
        type: boolean
        default: false

jobs:
  validate:
    name: Validate
    if: ${{ !inputs.skip_validation }}
    uses: ./.github/workflows/_validate.yaml
    secrets: inherit

  bump:
    name: Bump
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_validation) }}
    uses: ./.github/workflows/_bump_version.yaml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release:
    name: Release
    needs: [bump]
    uses: ./.github/workflows/_create_release.yaml
    secrets: inherit

  test-install-live:
    name: Test Install
    needs: [release]
    uses: ./.github/workflows/_test_install.yaml
    with:
      mode: live
    secrets: inherit

  cleanup-failed-release:
    name: Cleanup Failed Release
    needs: [release, test-install-live]
    if: ${{ always() && needs.test-install-live.result == 'failure' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete failed release
        run: |
          echo "Install test failed — deleting release ${{ needs.release.outputs.tag }}"
          gh release delete "${{ needs.release.outputs.tag }}" --yes \
            --cleanup-tag --repo "${{ github.repository }}"
