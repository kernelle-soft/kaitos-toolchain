name: Test Install

on:
  workflow_call:
    inputs:
      mode:
        description: >
          "simulated" builds the tarball locally and runs the installer directly.
          "live" curls the bootstrapper against a real GitHub release.
        required: true
        type: string
      tag:
        description: >
          Expected release tag in live mode (e.g. v1.2.3-dev.4).
          When set, the job waits for the release index to reflect this tag
          before running the bootstrapper. The bootstrapper always resolves
          via --prerelease. Omit to skip the index wait.
        required: false
        type: string

jobs:
  test-install:
    name: test-install
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Godot binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/kaitos/godot
          key: godot-${{ hashFiles('manifest.json') }}

      - name: Wait for release index to propagate
        if: inputs.mode == 'live' && inputs.tag != ''
        run: ./shell/scripts/ci/await_release_index.sh "${{ inputs.tag }}"

      # -- Simulated mode: build tarball, extract, run installer --

      - name: Setup build tools
        if: inputs.mode == 'simulated'
        uses: ./.github/actions/setup

      - uses: ./shell/.shock/actions/envrc
        if: inputs.mode == 'simulated'

      - name: Build and bundle
        if: inputs.mode == 'simulated'
        id: build
        run: |
          echo "artifact=$(./shell/scripts/chores/build.sh --release --bundle)" \
            >> "$GITHUB_OUTPUT"

      - name: Extract tarball
        if: inputs.mode == 'simulated'
        run: |
          mkdir -p /tmp/kaitos-install-test
          tar -xzf "${{ steps.build.outputs.artifact }}.tar.gz" \
            -C /tmp/kaitos-install-test

      - name: Run installer (simulated)
        if: inputs.mode == 'simulated'
        run: |
          extract_dir="$(find /tmp/kaitos-install-test -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJ=$extract_dir" >> "$GITHUB_ENV"
          export PROJ="$extract_dir"
          bash "$extract_dir/shell/scripts/install/install.sh"

      # -- Live mode: curl the bootstrapper --

      - name: Run bootstrapper (live)
        if: inputs.mode == 'live'
        run: curl -fsSL kaitos.dev/install.sh | sh -s -- --prerelease

      # -- Shared: run verification --

      - name: Setup test environment
        run: |
          echo "SHELLSHOCK_ENVRC=source $GITHUB_WORKSPACE/.envrc" >> "$GITHUB_ENV"

      - name: Set live install mode for re-run tests
        if: inputs.mode == 'live'
        run: echo "TEST_INSTALL_USE_LIVE=1" >> "$GITHUB_ENV"

      - name: Verify installation
        run: ./shell/scripts/ci/test_install.sh
