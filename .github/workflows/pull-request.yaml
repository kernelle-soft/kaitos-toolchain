name: Pull Request

on:
  pull_request:
    branches: [main]

# TODO: Run installers for coverage reporting. Then report coverage.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: ./scripts/chores/cicd_check_lint.sh

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Coverage Tooling
        run: ./scripts/chores/cicd_install_tools.sh

      - name: Run Tests
        run: ./scripts/chores/cicd_coverage.sh

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: rust,go
          fail_ci_if_error: true
          verbose: true
        
