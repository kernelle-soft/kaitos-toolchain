name: Create Release

on:
  workflow_call:

# TODO
jobs:
  check-prerelease:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "check prerelease"

  create-title:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "title"

  create-notes:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "notes"

  upload-release:
    runs-on: ubuntu-24.04
    needs:
      - check-prerelease
      - create-title
      - create-notes
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      gh release create "${{steps.tag.outputs.version }}" \
        --title "${{ steps.tag.outputs.version }}" \
        --generate-notes \
        --prerelease

    