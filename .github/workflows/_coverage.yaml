name: Run Tests and Upload Coverage

on:
  workflow_call:

jobs:
  coverage:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - uses: ./.github/actions/envrc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Coverage Tooling
        run: |
          ./scripts/chores/install_tools.sh \
            cargo-llvm-cov \
            gocover-cobertura

      - name: Run Tests
        run: ./scripts/ci/coverage.sh

      - name: Upload Go Coverage
        if: hashFiles('./coverage/go_coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/go_coverage.xml
          flags: go
          fail_ci_if_error: true
          verbose: true

      - name: Upload Rust Coverage
        if: hashFiles('./coverage/rust_coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/rust_coverage.xml
          flags: rust
          fail_ci_if_error: true
          verbose: true