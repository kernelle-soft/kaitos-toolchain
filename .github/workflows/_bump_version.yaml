name: Bump Project Version
on:
  workflow_call:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/envrc

      - name: Configure git
        run: ./scripts/chores/cicd_git_config.sh

      - name: Plan Version Bump
        id: plan
        run: |
          VERSION=$(./scripts/chores/bump_git_version.sh --dry-run)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo Workspace
        run: |
          ./scripts/chores/sync_cargo_version.sh \
            "${{ steps.plan.outputs.version }}"

      - name: Sync Project Manifest
        run: ./scripts/chores/sync_project_manifest.sh

      - name: Commit Version Bump
        run: |
          ./scripts/chores/cicd_git_commit.sh -a \
            -m "chore: bump to v${{ steps.plan.outputs.version }} [skip ci]"

      - name: Create Version Tag
        run: |
          git tag \
            -a "v${{ steps.plan.outputs.version }}" \
            -m "v${{ steps.plan.outputs.version }}"

      - name: Push changes and tags
        run: git push origin main --follow-tags
