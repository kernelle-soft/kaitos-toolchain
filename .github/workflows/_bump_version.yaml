name: Bump Project Version
on:
  workflow_call:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major, dev, alpha, beta, rc, release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate Auth Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./.github/actions/envrc

      - uses: ./.github/actions/setup
        with:
          go: false

      - name: Configure git
        run: ./scripts/ci/git_config.sh

      - name: Install Additional Tools
        run: ./scripts/chores/install_tools.sh tokei

      - name: Plan Version Bump
        id: plan
        run: |
          args=(--dry-run)
          if [[ -n "${{ inputs.bump_type }}" ]]; then
            args+=("--${{ inputs.bump_type }}")
          fi
          VERSION=$(./scripts/chores/bump_git_version.sh "${args[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo Workspace
        run: |
          ./scripts/chores/sync_cargo_version.sh \
            "${{ steps.plan.outputs.version }}"

      - name: Sync Project Manifest
        run: |
          ./scripts/chores/sync_project_manifest.sh \
            "${{ steps.plan.outputs.version }}"

      - name: Sync README
        run: |
          ./scripts/chores/sync_readme.sh \
            "${{ steps.plan.outputs.version }}"
        env:
          CODECOV_API_TOKEN: ${{ secrets.CODECOV_API_TOKEN }}

      - name: Commit Version Bump
        run: |
          ./scripts/ci/git_commit.sh -a \
            -m "chore: bump to v${{ steps.plan.outputs.version }} [skip ci]"

      - name: Create Version Tag
        run: |
          git tag \
            -a "v${{ steps.plan.outputs.version }}" \
            -m "v${{ steps.plan.outputs.version }}"

      - name: Push changes and tags
        run: git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
