# Manual-dispatch workflow that assigns Copilot's coding agent to every open
# issue tagged `agentic-greenlit`. Copilot creates a branch and opens a PR
# for each one.
#
# Intended to be triggered after a human reviews `agentic-candidate` issues
# from the triage workflow and re-tags the approved ones as `agentic-greenlit`.
# See also: agentic-triage.yaml
#
# Uses a personal PAT (AGENT_ASSIGNMENT_PAT) so the coding agent inherits
# the user's Copilot Pro entitlement. The default GITHUB_TOKEN is an org
# installation token and doesn't carry Copilot access.

name: Agentic Implementation

on:
  workflow_dispatch:

jobs:
  implement:
    name: implement
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Assign Copilot to greenlit issues
        env:
          GH_TOKEN: ${{ secrets.AGENT_ASSIGNMENT_PAT }}
        run: scripts/ci/agentic_implement.sh
