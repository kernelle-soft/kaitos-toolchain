changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - github-actions

  categories:
    - title: "⚠️ Breaking Changes"
      labels: [breaking]

    - title: "New Features"
      labels: [enhancement]

    - title: "New Language Features"
      labels: [vertex, edge, flair, vsave]

    - title: "Runtime Changes"
      labels: [vm, ecs, runtime, performance]

    - title: "Bindings Changes"
      labels: [godot, bevy]

    - title: "Bug Fixes"
      labels: [bug]

    - title: "Security"
      labels: [security]

    - title: "Environment & Install"
      labels: [environment, install]

    - title: "Documentation"
      labels: [docs, site]

    - title: "Testing"
      labels: [testing]

    - title: "Maintenance"
      labels: [chore, ci, refactor]

    - title: "Dependencies"
      labels: [dependencies]

    - title: "Agentic Contributions"
      labels: [agentic-greenlit]

    - title: "Other Changes"
      labels: ["*"]