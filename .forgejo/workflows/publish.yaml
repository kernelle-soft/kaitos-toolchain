name: Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - site/**
  workflow_dispatch:

jobs:
  lint:
    name: lint
    uses: ./.forgejo/workflows/_lint.yaml
    secrets: inherit

  security:
    name: security
    uses: ./.forgejo/workflows/_security.yaml
    secrets: inherit

  test:
    name: test
    uses: ./.forgejo/workflows/_test.yaml
    secrets: inherit

  release:
    name: release
    needs: [lint, security, test]
    uses: ./.forgejo/workflows/_release.yaml
    secrets: inherit
